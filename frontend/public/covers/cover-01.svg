<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Copertă originală de test: soare retro + grilă, în culorile temei -->
  <defs>
    <linearGradient id="cer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07030a"/>
      <stop offset="1" stop-color="#3a0b52"/>
    </linearGradient>
    <linearGradient id="soare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff73ff"/>
      <stop offset="1" stop-color="#ff007f"/>
    </linearGradient>
    <clipPath id="dungi">
      <rect x="0" y="40" width="200" height="56"/>
      <rect x="0" y="100" width="200" height="6"/>
      <rect x="0" y="110" width="200" height="4"/>
      <rect x="0" y="117" width="200" height="2"/>
    </clipPath>
  </defs>
  <rect width="200" height="200" fill="url(#cer)"/>
  <circle cx="100" cy="120" r="58" fill="url(#soare)" clip-path="url(#dungi)"/>
  <rect y="120" width="200" height="80" fill="#07030a"/>
  <g stroke="#d942ff" stroke-width="1.2" opacity="0.8">
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="130" x2="200" y2="130"/>
    <line x1="0" y1="145" x2="200" y2="145"/>
    <line x1="0" y1="166" x2="200" y2="166"/>
    <line x1="0" y1="196" x2="200" y2="196"/>
    <line x1="100" y1="120" x2="100" y2="200"/>
    <line x1="85" y1="120" x2="40" y2="200"/>
    <line x1="115" y1="120" x2="160" y2="200"/>
    <line x1="70" y1="120" x2="-20" y2="200"/>
    <line x1="130" y1="120" x2="220" y2="200"/>
  </g>
</svg>
